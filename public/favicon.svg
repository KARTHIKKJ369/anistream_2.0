<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Kuro Hardware Chassis -->
  <rect width="64" height="64" rx="12" fill="#000000"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="11.5" stroke="rgba(255,255,255,0.2)"/>
  
  <!-- Kuro (K) Dot-Matrix Glyph -->
  <g fill="#ffffff">
    <!-- Left vertical bar of K -->
    <circle cx="18" cy="18" r="2.8"/>
    <circle cx="18" cy="26" r="2.8"/>
    <circle cx="18" cy="34" r="2.8"/>
    <circle cx="18" cy="42" r="2.8"/>
    <circle cx="18" cy="50" r="2.8"/>

    <!-- Diagonal upper-right branch of K -->
    <circle cx="28" cy="34" r="2.8"/>
    <circle cx="37" cy="26" r="2.8"/>
    <circle cx="46" cy="18" r="2.8"/>

    <!-- Diagonal lower-right branch of K -->
    <circle cx="37" cy="42" r="2.8"/>
    <circle cx="46" cy="50" r="2.8"/>
  </g>

  <!-- Nothing Signature Red Status LED -->
  <circle cx="52" cy="12" r="3.5" fill="#D71921"/>
</svg>
