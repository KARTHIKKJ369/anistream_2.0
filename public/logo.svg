<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" fill="none">
  <!-- Kuro Hardware Chassis Emblem -->
  <g transform="translate(2, 4)">
    <rect width="40" height="40" rx="8" fill="#000000" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    
    <!-- (K) Dot-Matrix Glyph -->
    <g fill="#ffffff">
      <!-- Vertical bar -->
      <circle cx="12" cy="12" r="1.8"/>
      <circle cx="12" cy="17" r="1.8"/>
      <circle cx="12" cy="22" r="1.8"/>
      <circle cx="12" cy="27" r="1.8"/>
      <circle cx="12" cy="32" r="1.8"/>

      <!-- Upper diagonal -->
      <circle cx="19" cy="22" r="1.8"/>
      <circle cx="25" cy="17" r="1.8"/>
      <circle cx="31" cy="12" r="1.8"/>

      <!-- Lower diagonal -->
      <circle cx="25" cy="27" r="1.8"/>
      <circle cx="31" cy="32" r="1.8"/>
    </g>

    <!-- Nothing Signature Red LED Indicator -->
    <circle cx="34" cy="7" r="2.2" fill="#D71921"/>
  </g>

  <!-- Typography: Space Grotesk Bold KURO -->
  <g transform="translate(54, 30)">
    <text font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">
      KURO
    </text>
  </g>
</svg>
